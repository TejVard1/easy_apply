[project]
name = "easy-apply"
version = "0.1.0"
description = "Automate profile ingestion, resume tailoring, and job form auto-fill"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "easy_apply" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "requests>=2.32.3"
]

[project.optional-dependencies]
resume = [
  "pypdf>=4.3.1",
  "python-docx>=1.1.2"
]
automation = [
  "playwright>=1.46.0"
]
full = [
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
  "playwright>=1.46.0"
]

[project.scripts]
easy-apply = "easy_apply.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["easy_apply*"]
